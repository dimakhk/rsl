# The Xcode project is not kept in the repository: XcodeGen writes it from this
# file on every build (see .github/workflows/ios.yml).
name: RSL

options:
  bundleIdPrefix: io.github.dimakhk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: 1.24.2

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RSL:
    type: application
    platform: iOS
    sources:
      - path: RSL
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: RSL/Info.plist
      properties:
        CFBundleDisplayName: РЖЯ
        CFBundleDevelopmentRegion: ru
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Камера нужна, чтобы видеть жесты и переводить их в текст.
        UIAppFonts:
          - GolosText.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiredDeviceCapabilities:
          - arm64
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dimakhk.rsl.native
        PRODUCT_NAME: RSL
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO

  # Call the app's code directly: the model, frames, framing, the rule.
  RSLTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RSLTests
    dependencies:
      - target: RSL
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dimakhk.rsl.native.tests

  # Press the buttons on the screen, as a finger does.
  RSLUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RSLUITests
    dependencies:
      - target: RSL
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dimakhk.rsl.native.uitests
        TEST_TARGET_NAME: RSL

schemes:
  RSL:
    build:
      targets:
        RSL: all
        RSLTests: [test]
        RSLUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RSLTests
        - RSLUITests
    archive:
      config: Release
