<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-visual">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="РЖЯ">
  <meta name="theme-color" content="#EEEDDE">
  <title>Распознавание РЖЯ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preload" href="fonts/GolosText.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- After the Figma mockup (393x852, iPhone 15/16). Two colours only: beige
     #EEEDDE and burgundy #821414. Sizes are mockup points times --u.
     Icons are put in by app.js from icons.js (inline, so they can be coloured). -->
<div class="phone" id="phone">

  <!-- ====================================================== chat screens -->
  <div class="chat" id="chat">

    <!-- Screen 3: the camera, 393x467 from the very top, bottom corners 65 -->
    <div class="cam-glow" id="camGlow" aria-hidden="true"></div>
    <div class="camera" id="camera">
      <video id="video" autoplay playsinline muted></video>
      <div class="plaque" id="plaque" role="status" aria-live="polite"><span id="plaqueText"></span></div>
    </div>

    <!-- Messages: gestures on the right, voice and keyboard on the left -->
    <div class="feed" id="feed">
      <div class="feed-inner" id="feedInner"></div>
    </div>

    <p class="intro" id="intro">Чтобы начать чат<br>выберите один из способов взаимодействия.</p>

    <!-- Screen 4: the burgundy panel with a wavy top edge -->
    <div class="wave" id="wave" aria-hidden="true">
      <div class="wave-breath">
        <svg class="wave-crest" viewBox="0 0 786 24" preserveAspectRatio="none">
          <path id="wavePath" fill="currentColor"/>
        </svg>
      </div>
      <div class="wave-body"></div>
    </div>

    <header class="topbar" id="topbar">
      <button class="tb-btn tb-left" id="btnHistory" type="button" aria-label="История чатов"></button>
      <h1 class="tb-title" id="title"><span class="tb-dark">Чат #1</span><span class="tb-light" aria-hidden="true">Чат #1</span></h1>
      <button class="tb-btn tb-right" id="btnSound" type="button" aria-label="Озвучка" aria-pressed="true"></button>
    </header>

    <nav class="dock" id="dock" aria-label="Способ ввода">
      <button class="pill" id="pillGesture" type="button" aria-label="Жесты" aria-pressed="false"></button>
      <button class="pill" id="pillVoice" type="button" aria-label="Голос" aria-pressed="false"></button>
      <button class="pill" id="pillKeys" type="button" aria-label="Клавиатура" aria-pressed="false"></button>
    </nav>

    <!-- Screen 5: the strip that rides on top of the on-screen keyboard -->
    <div class="kbar" id="kbar">
      <textarea class="kbar-input" id="kbarInput" rows="1" enterkeyhint="send" autocomplete="off"
                autocapitalize="sentences" aria-label="Сообщение"></textarea>
      <button class="kbar-close" id="kbarClose" type="button" aria-label="Закрыть клавиатуру"></button>
    </div>
    <div class="kbd-sim" id="kbdSim" aria-hidden="true">клавиатура*</div>
  </div>

  <!-- =========================================================== history -->
  <section class="history" id="history" aria-label="История чатов" aria-hidden="true">
    <header class="hist-bar">
      <button class="tb-btn hist-plus" id="histPlus" type="button" aria-label="Новый чат"></button>
      <h1 class="hist-title">История</h1>
      <button class="tb-btn hist-close" id="histClose" type="button" aria-label="Вернуться в чат"></button>
    </header>
    <div class="wheel" id="wheel" role="listbox" aria-label="Чаты" tabindex="0">
      <div class="wheel-items" id="wheelItems"></div>
    </div>
    <!-- Required by the licences of the models. Plain text on purpose. -->
    <p class="credit">Модели: SignFlow-R · SberDevices, hukenovs/slovo · S3D · ai-forever/easy_sign · CC BY-SA 4.0</p>
  </section>

  <!-- ============================================================ splash -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-row" id="splashRow">
      <div class="logo logo-house" id="logoHouse"></div>
      <div class="logo logo-access" id="logoAccess"></div>
    </div>
  </div>
</div>

<script src="vendor/ort.webgpu.min.js"></script>
<script src="spring.js"></script>
<script src="icons.js"></script>
<script src="recognizer.js"></script>
<script src="framer.js"></script>
<script src="cloud.js"></script>
<script src="capture.js"></script>
<script src="app.js"></script>
</body>
</html>
