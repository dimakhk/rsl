<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no: a kiosk whose stop gesture is a double tap must not zoom on it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="РЖЯ">
  <meta name="theme-color" content="#000000">
  <title>Распознавание РЖЯ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preload" href="fonts/Katgru.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/MFEvoltSpecialFree.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- After the Figma mockup: 820x1180, portrait (11" iPad Air in points).
     The camera fills the screen; the black panel at the bottom holds the text. -->
<div class="backdrop">
  <video id="video" autoplay playsinline muted></video>
</div>

<div id="glow" class="glow" aria-hidden="true">
  <div class="glow-breath"><div class="glow-flow"></div></div>
</div>
<div id="rim" class="rim" aria-hidden="true"><div class="rim-flow"></div></div>

<main id="panel" class="panel">
  <div class="slot">
    <button id="start" class="start" type="button" aria-label="Начать распознавание">
      <span class="start-label">начать</span>
    </button>

    <div id="captions" class="captions" aria-live="polite">
      <div id="viewport" class="viewport single">
        <div id="words" class="words"></div>
      </div>
      <div id="placeholder" class="placeholder" aria-hidden="true">покажите жест</div>
    </div>
  </div>

  <!-- Required by the CC BY-SA 4.0 licence of the model. Plain text on purpose:
       a link on a kiosk would let a visitor navigate away. -->
  <p id="credit" class="credit">Модель S3D · ai-forever/easy_sign · CC BY-SA 4.0</p>
</main>

<div id="status" class="status" role="status"></div>

<script src="vendor/ort.webgpu.min.js"></script>
<script src="spring.js"></script>
<script src="recognizer.js"></script>
<script src="app.js"></script>
</body>
</html>
